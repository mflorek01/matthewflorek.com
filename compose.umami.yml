services:
  umami-postgres:
    image: postgres:16.14-alpine
    profiles: [analytics]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB:-umami}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD:?Set UMAMI_POSTGRES_PASSWORD in the host environment}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    networks:
      - umami_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    stop_grace_period: 30s

  umami:
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami:postgresql-v2.19.0}
    profiles: [analytics]
    restart: unless-stopped
    depends_on:
      umami-postgres:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER:-umami}:${UMAMI_POSTGRES_PASSWORD:?Set UMAMI_POSTGRES_PASSWORD in the host environment}@umami-postgres:5432/${UMAMI_POSTGRES_DB:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in the host environment}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:${UMAMI_HOST_PORT:-3110}:3000"
    networks:
      - umami_private
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    mem_limit: 768m
    cpus: 1.0
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    stop_grace_period: 30s

volumes:
  umami_postgres_data:
    name: portfolio_umami_postgres_data

networks:
  umami_private:
    name: portfolio_umami_private
    internal: true
